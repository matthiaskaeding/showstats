[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# narwhals is the only runtime dependency: statistics, formatting, table
# assembly and printing all go through it, so showstats adds nothing to
# whichever dataframe library the caller already has (#37).
#
# The floor is a feature floor, checked rather than guessed: 2.20.0 is
# where Expr.floor and Expr.ceil arrived, and everything else _utils uses
# predates it. requires-python caps which narwhals is installable at all —
# <=1.42.1 needs 3.8, 1.43.0-2.21.0 needs 3.9, 2.21.2+ needs 3.10 — so the
# two move together (#78).
dependencies = ["narwhals >= 2.20.0"]
name = "showstats"
description = "Vertical summary statistics for data frames"
authors = [{ name = "Matthias Kaeding" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
version = "0.2.0"
readme = "README.md"
requires-python = ">= 3.10"

[project.optional-dependencies]
# Convenience extras for people who want a dataframe library installed
# alongside showstats. None of them is required: showstats works with
# whatever narwhals-compatible frame it is handed.
pandas = ["pandas>=1.5.3", "pyarrow>=10.0.0"]
polars = ["polars>=0.20.21"]


[dependency-groups]
# Dev/test dependencies (PEP 735). Install with `uv sync`, which picks up the
# `dev` group by default. Runtime deps stay in [project.dependencies] above.
dev = [
  "build>=1.2.1",
  "duckdb>=1.0.0",
  "hatchling>=1.25.0",
  "hypothesis>=6.113.0",
  "jupyter>=1.0.0",
  "narwhals>=2.20.0",
  "nbclient==0.10.0",
  "nbformat==5.10.4",
  "nox==2024.4.15",
  "numpy>=1.24.4",
  "pandas>=1.5.3",
  "polars>=0.20.23",
  "pyarrow>=17.0.0",
  "pytest==8.3.2",
  "ruff==0.16.0",
  "twine>=5.1.1",
]

[tool.ruff]
# Ruff refuses to run under any other version. Its default rule set grows
# between releases, so a mismatch — from CI, a pre-commit hook or a stray
# global install — would lint under different rules than the project is
# configured for. Failing loudly beats findings nobody can reproduce.
required-version = "==0.16.0"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
# TID252 flags relative imports, so the absolute-import rule is enforced by
# the linter rather than relying on review to catch a `from .mod import x`.
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
pythonpath = ["src"]
# A test that unexpectedly passes fails the build, so an xfail cannot be left
# behind after the behaviour it describes has been implemented. Introduced
# for the #37 rewrite and kept now that it is finished; the `rewrite` marker
# it was paired with is gone, since the burndown reached zero.
xfail_strict = true
markers = [
  "integration: slower end-to-end test, deselected in CI",
]

[project.urls]
Homepage = "https://github.com/matthiaskaeding/showstats"
Issues = "https://github.com/matthiaskaeding/showstats/issues"
Changelog = "https://github.com/matthiaskaeding/showstats/blob/main/changelog.md"
