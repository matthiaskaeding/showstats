name: Render README

# README.md is generated from README.qmd. Its example output embeds real
# showstats output, so it goes stale when either the source .qmd or the
# package itself changes — hence the src/** trigger.
on:
  push:
    branches: [main]
    paths:
      - README.qmd
      - src/**
      - .github/workflows/readme.yaml
  workflow_dispatch:

# Only the newest commit on main is worth rendering, so supersede any run
# that is still working on an older one.
concurrency:
  group: render-readme
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.39"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # `uv run` puts the project environment on PATH, so quarto's jupyter
      # engine picks up the synced interpreter rather than the runner's.
      - name: Render README.qmd
        run: uv run quarto render README.qmd

      - name: Commit README.md if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # main can advance while this job runs, which rejects the push. When
          # that happens, re-render against the new tip rather than rebasing a
          # render that may already be stale, then try again.
          for attempt in 1 2 3; do
            if git diff --quiet -- README.md; then
              echo "README.md already up to date."
              exit 0
            fi

            git add README.md
            git commit -m "Re-render README.md from README.qmd"

            if git push; then
              echo "Pushed re-rendered README.md."
              exit 0
            fi

            echo "Push rejected on attempt ${attempt}; re-rendering against the latest main."
            git fetch origin main
            git reset --hard origin/main
            uv run quarto render README.qmd
          done

          echo "::error::Could not push the re-rendered README.md after 3 attempts."
          exit 1
